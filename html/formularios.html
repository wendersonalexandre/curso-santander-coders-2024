<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios html</title>
</head>
<body>
    <main>
        <h1>formulario </h1>
        <hr>

        <form>
            <label for="texto">Digite seu nome aqui:</label>
            <input type="text" id="texto" name="nomecliente" >
        </form>
        <br>

        <form >
            <label for="senha">Digite sua senha:</label>
            <input type="password" id="senha" name="senhacliente">
        </form>
        <br>

        <form>
            <label for="Email">Digite seu email:</label>
            <input type="Email" id="email" name="emailcliente">
        </form>
        <br>

        <form>
            <label for="data">Data de nascimento:</label>
            <input type="date" id="data" name="data">
        </form>
        <br>

        <form>
            <label for="hora">Digite a hora:</label>
            <input type="time" id="hora" name="hora">
        </form>
        <br>

        <form >
            <label for="numero">digite aqui seu cpf:</label>
            <input type="nunber" id="numero">
        </form>
        <br>

        <form >
            <label for="arquivo">coloque o arquivo:</label>
            <input type="file" id="arquivo">
        </form>
        <br>

        <textarea name="bio" id="bio"></textarea>
         
        <br>

        <select name="select" id="select">
            <option value="" disabled selected >selecione uma das opções...</option>
            <option value="numero um">receita 1</option>
            <option value="numero dois">receita 2</option>
            <option value="numero 3">receita 3</option>
            <option value="numero 4">receita 4</option>
            <option value="numero 5">receita 5</option>
        </select>
        <br> <br>
        <form>
            <input type="submit" name="enviar" id="formulario">
        </form>
    </main>
</body>
</html>
